<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stockly - Inventory Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">S</span>
      <div>
        <h1>Stockly</h1>
        <p>Inventory Management System</p>
      </div>
    </div>
    <button id="add-btn" class="btn btn-primary">Add product</button>
  </header>

  <main>
    <p class="summary">
      <span>Products: <b id="stat-products">0</b></span>
      <span>Units in stock: <b id="stat-units">0</b></span>
      <span>Total stock value: <b id="stat-value">0.00</b></span>
      <span>Low or out of stock: <b id="stat-low">0</b></span>
    </p>

    <section class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search by name, ID or category">
        <select id="category-filter"></select>
        <label class="check">
          <input type="checkbox" id="low-only"> Low stock only
        </label>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Category</th>
              <th class="num">Quantity</th>
              <th class="num">Price</th>
              <th class="num">Value</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="product-list"></tbody>
        </table>
      </div>
      <p id="empty-message" class="empty" hidden></p>
    </section>
  </main>

  <dialog id="product-dialog">
    <form id="product-form" novalidate>
      <h2 id="dialog-title">Add product</h2>

      <label>Product ID
        <input type="text" id="product-id" maxlength="15" placeholder="e.g. P001">
      </label>
      <label>Product name
        <input type="text" id="product-name" maxlength="60" placeholder="e.g. Notebook A4">
      </label>
      <label>Category
        <input type="text" id="product-category" list="category-list" maxlength="30" placeholder="e.g. Stationery">
        <datalist id="category-list"></datalist>
      </label>
      <div class="row">
        <label>Quantity
          <input type="number" id="product-quantity" min="0" step="1" placeholder="0">
        </label>
        <label>Price
          <input type="number" id="product-price" min="0" step="0.01" placeholder="0.00">
        </label>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="form-actions">
        <button type="button" id="cancel-btn" class="btn btn-light">Cancel</button>
        <button type="submit" class="btn btn-primary">Save product</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
